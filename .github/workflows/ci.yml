name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# The jobs only read the repository (lint, test, type check, build)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Lint
        run: npm run lint

      # Colors legible only by luck: a theme color as text, a fixed color…
      - name: Audit the playground colors (code)
        run: node bin/venix-jade.mjs audit playground

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Playground prepare
        run: npm run dev:prepare

      # The browser tests (test/browser) drive Chromium; locally they use the installed Edge
      - name: Install the browser
        run: npx playwright-core install --with-deps chromium

      - name: Test
        run: npm run test

      - name: Type check
        run: npm run test:types

      # The contrast on screen, on every theme and mode. A development server:
      # only there the audit switches themes the way the app does (Vuetify too)
      - name: Audit the playground colors (screen)
        run: |
          npx nuxt dev playground --port 3000 > playground-dev.log 2>&1 &
          timeout 240 bash -c 'until curl -sf -o /dev/null http://localhost:3000/; do sleep 2; done' || { cat playground-dev.log; exit 1; }
          node bin/venix-jade.mjs audit --no-code --url http://localhost:3000/
          kill $! || true

      - name: Build
        run: npm run prepack

      # Reads the built package the way a consumer's tools do (`exports`, types, files)
      - name: Lint the package
        run: npx --yes publint@0.3.25

      # The playground is the only place Vuetify, UnoCSS and i18n meet the module:
      # a break in one of those integrations only shows when it is built
      - name: Build the playground
        run: npm run dev:build
