name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# The jobs only read the repository (lint, test, type check, build)
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Playground prepare
        run: npm run dev:prepare

      # The browser tests (test/browser) drive Chromium; locally they use the installed Edge
      - name: Install the browser
        run: npx playwright-core install --with-deps chromium

      - name: Test
        run: npm run test

      - name: Type check
        run: npm run test:types

      - name: Build
        run: npm run prepack

      # Reads the built package the way a consumer's tools do (`exports`, types, files)
      - name: Lint the package
        run: npx --yes publint@0.3.25

      # The playground is the only place Vuetify, UnoCSS and i18n meet the module:
      # a break in one of those integrations only shows when it is built
      - name: Build the playground
        run: npm run dev:build
